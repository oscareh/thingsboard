name: Build & Push ThingsBoard (brand)

on:
  push:
    branches: [ "brand-4.2" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ThingsBoard artifacts
        run: mvn -B clean install -DskipTests -Dlicense.skip=true

      - name: Extract .deb to minimal rootfs for Docker build
        run: |
          echo "Listing application/target:"
          ls -la application/target || true

          # En ThingsBoard suele generarse application/target/thingsboard.deb
          DEB_PATH="application/target/thingsboard.deb"
          if [ ! -f "$DEB_PATH" ]; then
            DEB_PATH="$(ls -1 application/target/*.deb 2>/dev/null | head -n 1)"
          fi

          if [ -z "$DEB_PATH" ] || [ ! -f "$DEB_PATH" ]; then
            echo "ERROR: No .deb found in application/target/"
            exit 1
          fi

          echo "Using deb: $DEB_PATH"
          dpkg-deb -c "$DEB_PATH" | head -n 60

          rm -rf docker/rootfs docker/rootfs-min
          mkdir -p docker/rootfs docker/rootfs-min

          dpkg-deb -x "$DEB_PATH" docker/rootfs

          # Copiamos solo lo necesario (evita conflictos tipo /lib symlink)
          if [ -d docker/rootfs/usr/share/thingsboard ]; then
            mkdir -p docker/rootfs-min/usr/share
            cp -a docker/rootfs/usr/share/thingsboard docker/rootfs-min/usr/share/
          fi

          if [ -d docker/rootfs/etc/thingsboard ]; then
            mkdir -p docker/rootfs-min/etc
            cp -a docker/rootfs/etc/thingsboard docker/rootfs-min/etc/
          fi

          echo "rootfs-min contents:"
          find docker/rootfs-min -maxdepth 4 -type d | sort | head -n 200

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.brand
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/tb-postgres-brand:4.2
          build-args: |
            TB_BASE_TAG=4.2.1.1
