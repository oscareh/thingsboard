name: Build & Push ThingsBoard (brand)

on:
  push:
    branches: [ "brand-4.2" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ThingsBoard artifacts
        run: mvn -B clean install -DskipTests -Dlicense.skip=true

      - name: Copy boot jar for Docker build
        run: |
          ls -la application/target || true
          BOOT_JAR="$(ls -1 application/target/*-boot.jar 2>/dev/null | head -n 1)"
          if [ -z "$BOOT_JAR" ]; then
            echo "ERROR: No *-boot.jar found in application/target/"
            exit 1
          fi
          mkdir -p docker
          cp "$BOOT_JAR" docker/thingsboard.jar
          echo "Using boot jar: $BOOT_JAR"
          ls -la docker/thingsboard.jar

      # Necesario para poder construir ARM64 desde el runner (que es AMD64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.brand
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/tb-postgres-brand:4.2-arm64
          build-args: |
            TB_BASE_TAG=4.2.1.1

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.brand
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/tb-postgres-brand:4.2-amd64
          build-args: |
            TB_BASE_TAG=4.2.1.1
