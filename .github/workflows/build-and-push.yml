name: Build & Push ThingsBoard (brand)

on:
  push:
    branches: [ "brand-4.2" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build ThingsBoard artifacts
        run: mvn -B clean install -DskipTests

      - name: Copy .deb for Docker build
        run: |
          DEB_PATH="$(ls -1 application/target/*.deb 2>/dev/null | head -n 1)"
          if [ -z "$DEB_PATH" ]; then
            echo "ERROR: No .deb found in application/target/"
            ls -la application/target || true
            exit 1
          fi
          cp "$DEB_PATH" docker/thingsboard.deb
          echo "Using deb: $DEB_PATH"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.brand
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/tb-postgres-brand:4.2
          build-args: |
            TB_BASE_TAG=4.2.1.1
